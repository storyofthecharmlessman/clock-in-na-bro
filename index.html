<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Zone Dashboard</title>
    <style>
        /* ... (Keep your existing CSS variables and base styles) ... */
        .clock-card {
            position: absolute;
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            border: 4px solid var(--border);
            text-align: center;
            user-select: none;
            touch-action: none; 
            transition: border-color 0.2s;
        }
        /* Visual cue for when a clock is unlocked on mobile */
        .clock-card.unlocked { border-color: #ff9e00; cursor: move; }
        
        button { background: var(--accent); color: white; border: none; padding: 8px 12px; border-radius: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <script>
        // ... (Keep your existing setup code) ...

        function addClock() {
            // ... (your existing timezone validation and creation code) ...
            
            let isLocked = true;
            let lastTap = 0;

            // Mobile: Double-tap to unlock
            clockDiv.addEventListener('touchstart', (e) => {
                const now = new Date().getTime();
                const timeSinceLastTap = now - lastTap;
                if (timeSinceLastTap < 300 && timeSinceLastTap > 0) {
                    isLocked = !isLocked;
                    clockDiv.classList.toggle('unlocked', !isLocked);
                }
                lastTap = now;
            });

            // Drag logic
            const dragStart = (e) => {
                // If it's mobile and locked, do not allow move
                if (e.type === 'touchstart' && isLocked) return;

                // Handle coordinates for both mouse and touch
                const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
                const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;

                let shiftX = clientX - clockDiv.getBoundingClientRect().left;
                let shiftY = clientY - clockDiv.getBoundingClientRect().top;

                const moveAt = (pageX, pageY) => {
                    clockDiv.style.left = pageX - shiftX + 'px';
                    clockDiv.style.top = pageY - shiftY + 'px';
                };

                const onMove = (e) => {
                    const pX = e.type === 'touchmove' ? e.touches[0].pageX : e.pageX;
                    const pY = e.type === 'touchmove' ? e.touches[0].pageY : e.pageY;
                    moveAt(pX, pY);
                };

                document.addEventListener('mousemove', onMove);
                document.addEventListener('touchmove', onMove, { passive: false });

                const stopDrag = () => {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('touchmove', onMove);
                };

                document.onmouseup = stopDrag;
                document.ontouchend = stopDrag;
            };

            // Listeners
            clockDiv.addEventListener('mousedown', dragStart);
            clockDiv.addEventListener('touchstart', dragStart, { passive: false });

            // ... (rest of your existing code for updateTime/appendChild) ...
        }
    </script>
</body>
</html>
