<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Zone Dashboard</title>
    <style>
        /* ... (Keep your existing CSS variables and base styles) ... */
        .clock-card {
            position: absolute;
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            border: 4px solid var(--border);
            text-align: center;
            user-select: none;
            touch-action: none; 
            transition: border-color 0.2s;
        }
        /* Visual cue for when a clock is unlocked on mobile */
        .clock-card.unlocked { border-color: #ff9e00; cursor: move; }
        
        button { background: var(--accent); color: white; border: none; padding: 8px 12px; border-radius: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <script>
        // ... (Keep your existing setup code) ...

        function addClock() {
            // ... (your existing timezone validation and creation code) ...
            
            let isLocked = true;
            let lastTap = 0;

            // Mobile: Double-tap to unlock
            clockDiv.addEventListener('touchstart', (e) => {
                const now = new Date().getTime();
                const timeSinceLastTap = now - lastTap;
                if (timeSinceLastTap < 300 && timeSinceLastTap > 0) {
                    isLocked = !isLocked;
                    clockDiv.classList.toggle('unlocked', !isLocked);
                }
                lastTap = now;
            });

// Drag Logic for Mouse AND Touch
            const startDrag = (clientX, clientY) => {
                let shiftX = clientX - clockDiv.getBoundingClientRect().left;
                let shiftY = clientY - clockDiv.getBoundingClientRect().top;

                const moveAt = (pageX, pageY) => {
                    clockDiv.style.left = pageX - shiftX + 'px';
                    clockDiv.style.top = pageY - shiftY + 'px';
                };

                const onMove = (e) => {
                    const x = e.pageX || e.touches[0].pageX;
                    const y = e.pageY || e.touches[0].pageY;
                    moveAt(x, y);
                };

                const onEnd = () => {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('touchmove', onMove);
                    document.removeEventListener('mouseup', onEnd);
                    document.removeEventListener('touchend', onEnd);
                };

                document.addEventListener('mousemove', onMove);
                document.addEventListener('touchmove', onMove, {passive: false});
                document.addEventListener('mouseup', onEnd);
                document.addEventListener('touchend', onEnd);
            };

            clockDiv.onmousedown = (e) => startDrag(e.clientX, e.clientY);
            clockDiv.ontouchstart = (e) => startDrag(e.touches[0].clientX, e.touches[0].clientY);
        }
    </script>
</body>
</html>
